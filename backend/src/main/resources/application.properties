spring.application.name=erp-backend

# --- Database -------------------------------------------------------------------------------
# Every value can be overridden with an environment variable; the defaults match compose.yaml (dev only!).
# The app connects as the low-privilege role erp_app (subject to Row-Level Security) ...
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/retail_erp}
spring.datasource.username=${DB_APP_USER:erp_app}
spring.datasource.password=${DB_APP_PASSWORD:erp_app_dev_password}
# ... while Flyway runs migrations as the owner/admin role (it creates tables and the erp_app role).
spring.flyway.user=${DB_ADMIN_USER:erp_owner}
spring.flyway.password=${DB_ADMIN_PASSWORD:erp_owner_dev_password}
spring.flyway.placeholders.app_db_user=${spring.datasource.username}
spring.flyway.placeholders.app_db_password=${spring.datasource.password}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep a DB connection open for the whole HTTP request (see LEARNING.md).
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Web ------------------------------------------------------------------------------------
spring.mvc.problemdetails.enabled=true

# --- Security / JWT -------------------------------------------------------------------------
# Base64 key, at least 32 bytes (openssl rand -base64 32). Empty = random key per startup (dev only).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=retail-erp
app.jwt.ttl=8h
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Actuator / API docs --------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# --- Plans / platform -----------------------------------------------------------------------
app.subscription.trial-days=14
# The first platform admin (runs the SaaS: assigns plans to shops). Set both to create it at startup.
app.platform.admin-email=${PLATFORM_ADMIN_EMAIL:}
app.platform.admin-password=${PLATFORM_ADMIN_PASSWORD:}
app.pos.cashier-max-discount-percent=10
